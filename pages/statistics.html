<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计 - 政策解读系统</title>
  <style>[v-cloak]{display:none!important}</style>
  <link rel="stylesheet" href="/lib/cdn/element-plus.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/form.css">
  <style>
    @media(max-width:1080px){.metric-grid--6{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:760px){.metric-grid--6{grid-template-columns:repeat(2,minmax(0,1fr))}.page-header{flex-direction:column;align-items:flex-start}.page-header>div:last-child{display:flex;flex-wrap:wrap;gap:8px;width:100%}.page-header>div:last-child .el-date-editor{width:100%}}
  </style>
</head>
<body data-page-tone="blue">
  <div class="main-layout" id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-logo"></div>
      <nav class="sidebar-menu" id="sidebar-menu"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <div class="header-toggle" onclick="toggleSidebar()"><i class="el-icon-s-unfold" style="font-size:20px;"></i></div>
          <nav class="header-breadcrumb"></nav>
        </div>
        <div class="header-right">
          <div class="header-icon"><i class="el-icon-bell" style="font-size:20px;"></i></div>
          <div class="header-user"><div class="avatar">管</div><div class="info"><span class="name">管理员</span><span class="role">系统管理员</span></div></div>
        </div>
      </header>

      <div class="content-wrapper page-canvas" v-cloak>
        <!-- 页面标题 -->
        <div class="page-header">
          <div>
            <h1 class="page-title">数据统计</h1>
            <p class="page-description">政策数据的采集、标注、融合、结构化与匹配全流程统计</p>
          </div>
          <div>
            <el-date-picker v-model="dateRange" type="daterange" range-separator="至" start-placeholder="开始日期" end-placeholder="结束日期" style="margin-right:12px;" />
            <el-button type="primary" icon="el-icon-download">导出报表</el-button>
          </div>
        </div>

        <!-- 统计卡片 -->
        <div class="metric-grid metric-grid--6">
          <div class="stat-card">
            <div class="stat-card-icon blue"><i class="el-icon-document"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">政策总数</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 实时数据</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon green"><i class="el-icon-download"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">采集数量</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 实时数据</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon orange"><i class="el-icon-collection-tag"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">标注数量</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 暂无数据</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon red"><i class="el-icon-connection"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">融合数量</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 暂无数据</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon blue"><i class="el-icon-data-analysis"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">结构化数量</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 暂无数据</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon green"><i class="el-icon-s-custom"></i></div>
            <div class="stat-card-content">
              <div class="stat-card-value">-</div>
              <div class="stat-card-label">匹配数量</div>
              <div class="stat-card-trend up"><i class="el-icon-top"></i> 暂无数据</div>
            </div>
          </div>
        </div>

        <!-- 图表区域 -->
        <div class="panel-grid panel-grid--sidebar mb-20">
          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="el-icon-data-line"></i> 政策处理趋势</div>
              <el-radio-group v-model="trendType" size="small">
                <el-radio-button label="monthly">月度</el-radio-button>
                <el-radio-button label="weekly">周度</el-radio-button>
                <el-radio-button label="daily">日度</el-radio-button>
              </el-radio-group>
            </div>
            <div id="main-trend-chart" class="chart-container"></div>
          </div>
          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="el-icon-pie-chart"></i> 政策分类分布</div>
            </div>
            <div id="category-pie-chart" class="chart-container"></div>
          </div>
        </div>

        <!-- 下方图表 -->
        <div class="panel-grid panel-grid--2 mb-20">
          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="el-icon-s-marketing"></i> 标注进度</div>
            </div>
            <div id="progress-chart" class="chart-container"></div>
          </div>
          <div class="card">
            <div class="card-header">
              <div class="card-title"><i class="el-icon-s-data"></i> 企业匹配分布</div>
            </div>
            <div id="match-chart" class="chart-container"></div>
          </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-container">
          <div class="table-header">
            <span class="table-title">各分类详细统计</span>
          </div>
          <el-table :data="categoryStats" stripe style="width:100%">
            <el-table-column prop="category" label="分类名称" width="150" />
            <el-table-column prop="total" label="政策总数" width="120" align="right" />
            <el-table-column prop="crawled" label="已采集" width="120" align="right" />
            <el-table-column prop="tagged" label="已标注" width="120" align="right" />
            <el-table-column prop="merged" label="已融合" width="120" align="right" />
            <el-table-column prop="structured" label="已结构化" width="120" align="right" />
            <el-table-column prop="matched" label="已匹配" width="120" align="right" />
            <el-table-column prop="progress" label="完成率" width="200">
              <template #default="{ row }">
                <div class="progress-inline">
                  <div class="progress-bar" style="flex:1;">
                    <div class="progress-bar-fill green" :style="{ width: row.progress + '%' }"></div>
                  </div>
                  <span class="text-accent" style="min-width:40px;">{{ row.progress }}%</span>
                </div>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </div>
    </main>
  </div>

  <script src="/lib/cdn/vue.global.js"></script>
  <script src="/lib/cdn/element-plus.umd.js"></script>
  <script src="/lib/cdn/echarts.min.js"></script>
  <script src="/lib/cdn/element-plus-icons.min.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/page-init.js"></script>
  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const app = createApp({
      setup() {
        const dateRange = ref('');
        const trendType = ref('monthly');
        const categoryStats = ref([
          { category: '科技创新', total: 3256, crawled: 3200, tagged: 2980, merged: 892, structured: 568, matched: 1235, progress: 91.5 },
          { category: '产业发展', total: 2890, crawled: 2856, tagged: 2567, merged: 756, structured: 489, matched: 982, progress: 88.8 },
          { category: '绿色低碳', total: 2156, crawled: 2100, tagged: 1890, merged: 534, structured: 312, matched: 756, progress: 87.7 },
          { category: '民生保障', total: 1890, crawled: 1856, tagged: 1567, merged: 423, structured: 289, matched: 623, progress: 82.9 },
          { category: '农业农村', total: 1456, crawled: 1400, tagged: 1234, merged: 345, structured: 198, matched: 456, progress: 84.8 },
          { category: '对外开放', total: 932, crawled: 900, tagged: 782, merged: 212, structured: 156, matched: 289, progress: 83.9 }
        ]);

        const initCharts = () => {
          // 趋势图
          const trendChart = echarts.init(document.getElementById('main-trend-chart'));
          trendChart.setOption({
            tooltip: { trigger: 'axis' },
            legend: { data: ['采集', '标注', '融合', '结构化', '匹配'] },
            grid: { left: '3%', right: '4%', bottom: '3%', top: '15%', containLabel: true },
            xAxis: { type: 'category', data: ['1月', '2月', '3月', '4月', '5月', '6月'] },
            yAxis: { type: 'value' },
            series: [
              { name: '采集', type: 'line', data: [1200, 1350, 1580, 1420, 1680, 1850], smooth: true, lineStyle: { color: '#67c23a' }, itemStyle: { color: '#67c23a' } },
              { name: '标注', type: 'line', data: [800, 920, 1100, 980, 1200, 1380], smooth: true, lineStyle: { color: '#165dff' }, itemStyle: { color: '#165dff' } },
              { name: '融合', type: 'line', data: [320, 380, 456, 412, 520, 580], smooth: true, lineStyle: { color: '#e6a23c' }, itemStyle: { color: '#e6a23c' } },
              { name: '结构化', type: 'line', data: [180, 220, 289, 312, 380, 420], smooth: true, lineStyle: { color: '#f56c6c' }, itemStyle: { color: '#f56c6c' } },
              { name: '匹配', type: 'line', data: [300, 450, 580, 620, 800, 950], smooth: true, lineStyle: { color: '#909399' }, itemStyle: { color: '#909399' } }
            ]
          });

          // 饼图
          const pieChart = echarts.init(document.getElementById('category-pie-chart'));
          pieChart.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
            legend: { orient: 'vertical', right: '5%', top: 'center' },
            color: ['#165dff', '#4080ff', '#79b8ff', '#adc6ff', '#d0d5df', '#e8ecf0'],
            series: [{
              type: 'pie', radius: ['45%', '70%'], center: ['35%', '50%'],
              itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
              label: { show: false },
              data: []
            }]
          });

          // 进度图
          const progressChart = echarts.init(document.getElementById('progress-chart'));
          progressChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { data: ['完成率'] },
            grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
            xAxis: { type: 'category', data: categoryStats.value.map(c => c.category) },
            yAxis: { type: 'value', max: 100, axisLabel: { formatter: '{value}%' } },
            series: [{
              name: '完成率', type: 'bar',
              data: categoryStats.value.map(c => c.progress),
              itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#67c23a' }, { offset: 1, color: '#95d475' }]), borderRadius: [4, 4, 0, 0] },
              barWidth: '40%'
            }]
          });

          // 匹配分布图
          const matchChart = echarts.init(document.getElementById('match-chart'));
          matchChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
            xAxis: { type: 'category', data: ['科技创新', '产业发展', '绿色低碳', '民生保障', '农业农村', '对外开放'] },
            yAxis: { type: 'value' },
            series: [{
              type: 'bar',
              data: [1235, 982, 756, 623, 456, 289],
              itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#165dff' }, { offset: 1, color: '#4080ff' }]),
                borderRadius: [4, 4, 0, 0]
              },
              barWidth: '50%'
            }]
          });

          window.addEventListener('resize', () => {
            trendChart.resize();
            pieChart.resize();
            progressChart.resize();
            matchChart.resize();
          });
        };

        onMounted(() => {
          setTimeout(initCharts, 100);
        });

        return { dateRange, trendType, categoryStats };
      }
    });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) { app.component(key, component); }
    app.use(ElementPlus);
    app.mount('#app');
    PageInit.initStandalonePage();
  </script>
</body>
</html>
